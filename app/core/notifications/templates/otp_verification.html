<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code de vérification</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; background: #f5f5f5; }
    .container { background: white; padding: 30px; border-radius: 8px; margin: 20px; text-align: center; }
    .header { background: #2563eb; color: white; padding: 20px; border-radius: 8px 8px 0 0; }
    .header h1 { margin: 0; font-size: 22px; }
    .body { padding: 30px 20px; }
    .otp-box {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 12px;
      color: #2563eb;
      padding: 20px;
      background: #f0f4ff;
      border-radius: 8px;
      margin: 20px auto;
      display: inline-block;
    }
    .note { color: #666; font-size: 13px; }
    .warning { color: #999; font-size: 12px; margin-top: 16px; }
    .footer { color: #666; font-size: 12px; text-align: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 12px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Code de vérification</h1>
  </div>
  <div class="body">
    <p>Bonjour <strong>{{ user_name }}</strong>,</p>
    <p>Votre code de vérification est :</p>
    <div class="otp-box">{{ otp_code }}</div>
    <p class="note">Ce code expire dans <strong>{{ expires_in }}</strong>.</p>
    <p class="warning">Ne partagez jamais ce code avec quelqu'un.</p>
  </div>
  <div class="footer">
    <p>{{ app_name | default("Gestion Clinique") }} — Ne répondez pas à cet email</p>
  </div>
</div>
</body>
</html>
