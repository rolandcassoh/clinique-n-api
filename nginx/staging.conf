# nginx/staging.conf — Dual-stack (PHASE 3-4 : migration progressive)
# Routing sélectif : endpoints migrés → Python, reste → Laravel (fallback)
# Pour basculer un module sur Python : décommenter le bloc correspondant.

upstream python_api {
    server python-api:8000;
    keepalive 16;
}

upstream laravel_api {
    server laravel:80;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name staging-api.clinique.app;

    ssl_certificate     /etc/letsencrypt/live/staging-api.clinique.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.clinique.app/privkey.pem;
    include /etc/nginx/snippets/ssl_params.conf;

    client_max_body_size 10M;

    # ── Health check Python (toujours actif, sert au décommissionnement) ────────
    location = /health {
        proxy_pass http://python_api;
        include /etc/nginx/snippets/proxy_params.conf;
        access_log off;
    }

    # ══════════════════════════════════════════════════════════════════════════════
    # MODULES MIGRÉS → PYTHON
    # ══════════════════════════════════════════════════════════════════════════════

    # Phase 0 — Auth (migré en premier, critique)
    location ~ ^/api/auth/ {
        proxy_pass http://python_api;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    # Phase 1 — Référentiels (données statiques, faible risque)
    location ~ ^/api/(countries|states|cities|currencies|languages|tags|faq|pages|blog|sliders|constants)/ {
        proxy_pass http://python_api;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    # Phase 2 — Commerce (produits, commandes, panier)
    location ~ ^/api/(products|product-categories|brands|cart|wishlist|orders|services|service-categories|request-services|shipping|taxes|promotions|customers)/ {
        proxy_pass http://python_api;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    # Phase 3 — Clinique (cliniques, médecins, abonnements)
    location ~ ^/api/(clinics|clinic-categories|doctors|vitals|subscription-plans|subscriptions)/ {
        proxy_pass http://python_api;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    # Phase 4 — Médical (RDVs, facturation, wallet, commissions)
    location ~ ^/api/(appointments|encounters|billing|wallet|commissions|webhooks)/ {
        proxy_pass http://python_api;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    # ══════════════════════════════════════════════════════════════════════════════
    # FALLBACK → LARAVEL (modules non encore migrés ou en cours de validation)
    # ══════════════════════════════════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://laravel_api;
        include /etc/nginx/snippets/proxy_params.conf;
    }
}
