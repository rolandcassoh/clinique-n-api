# nginx/nginx.conf — Production (PHASE 5 : 100% Python FastAPI)
# Tous les endpoints routés vers le cluster python-api

upstream python_api {
    server python-api-1:8000 weight=1 max_fails=3 fail_timeout=30s;
    server python-api-2:8000 weight=1 max_fails=3 fail_timeout=30s;
    server python-api-3:8000 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ── Redirection HTTP → HTTPS ───────────────────────────────────────────────────
server {
    listen 80;
    server_name api.clinique.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.clinique.app;

    # ── Certificats TLS (Let's Encrypt) ────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.clinique.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.clinique.app/privkey.pem;
    include /etc/nginx/snippets/ssl_params.conf;

    # ── Zones de rate limiting ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_global:10m  rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=webhooks:10m    rate=200r/m;

    # ── Journalisation ──────────────────────────────────────────────────────────
    access_log /var/log/nginx/api_access.log combined;
    error_log  /var/log/nginx/api_error.log warn;

    # ── Taille max upload (images, fichiers médicaux) ──────────────────────────
    client_max_body_size 10M;

    # ── Compression Gzip ───────────────────────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1000;

    # ── Health check (pas de rate limit, pas de log) ───────────────────────────
    location = /health {
        proxy_pass http://python_api;
        include /etc/nginx/snippets/proxy_params.conf;
        access_log off;
    }

    # ── Métriques Prometheus (accès réseau interne uniquement) ─────────────────
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://python_api;
        include /etc/nginx/snippets/proxy_params.conf;
        access_log off;
    }

    # ── Auth — rate limiting strict anti-brute-force ───────────────────────────
    location ~ ^/api/auth/(login|register|forgot-password|otp) {
        limit_req zone=auth_strict burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://python_api;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    # ── Webhooks paiement — rate limit souple (Stripe, PayPal, etc.) ───────────
    location ~ ^/api/webhooks/ {
        limit_req zone=webhooks burst=50 nodelay;
        proxy_pass http://python_api;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    # ── Swagger UI — désactivé en production, actif en staging ─────────────────
    location ~ ^/(docs|redoc|openapi.json) {
        # Décommenter en staging uniquement :
        # proxy_pass http://python_api;
        return 404;
    }

    # ── API principale — tous les modules Python ────────────────────────────────
    location /api/ {
        limit_req zone=api_global burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://python_api;
        include /etc/nginx/snippets/proxy_params.conf;

        # CORS headers (complément si non gérés par FastAPI CORSMiddleware)
        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials true always;

        # Réponse preflight immédiate (évite de proxifier OPTIONS vers FastAPI)
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length               0;
            return 204;
        }
    }

    # ── Pages d'erreur JSON (format cohérent avec FastAPI) ─────────────────────
    error_page 429 /429.json;
    location = /429.json {
        default_type application/json;
        return 429 '{"detail":"Too many requests. Please slow down.","type":"rate_limit_exceeded"}';
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        default_type application/json;
        return 503 '{"detail":"Service temporarily unavailable. Please retry.","type":"service_unavailable"}';
    }
}
